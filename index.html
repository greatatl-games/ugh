<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugh! — English spelling rule game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --ink:#1d2433; --muted:#6b6f7a; --line:#d8cfbd; --card:#fffaf0;
  --accent:#d9482b; --accent-soft:#f8dccf;
  --correct:#2a6fd6; --present:#e0661c; --absent:#767b86;
  --key:#e4dcca; --tile-ink:#1d2433;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141821; --ink:#eef0f5; --muted:#9aa0ad; --line:#3a4152; --card:#1c212d;
    --accent:#ff7a59; --accent-soft:#3a2620; --correct:#3b82e6; --present:#d9702a;
    --absent:#4a505e; --key:#343b4b; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100dvh;display:flex;justify-content:center;touch-action:manipulation}
#app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;padding:0 10px 10px}
button{font-family:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;height:54px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-family:var(--serif);font-weight:800;font-size:27px;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
.ib{width:40px;height:40px;border:0;background:none;font-size:20px;border-radius:10px;cursor:pointer}
.ib:active{background:var(--key)}
.hr{display:flex}
.rule{margin:10px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.rule .badge{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:24px}
.rule .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rule .nm{font-family:var(--serif);font-weight:800;font-size:21px;line-height:1.15;margin:1px 0 2px}
.rule .ds{font-size:14px;line-height:1.3}
.rule .meta{font-size:12px;color:var(--muted);margin-top:3px}
.rule .meta b{font-weight:500;color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0}
#board{--t:min(15vw,clamp(34px,calc((100dvh - 430px)/6),60px));display:grid;gap:6px}
.row{display:grid;grid-template-columns:repeat(5,var(--t));gap:6px}
.tile{width:var(--t);height:var(--t);border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:calc(var(--t)*.55);text-transform:uppercase;color:var(--tile-ink);user-select:none;background:transparent}
.tile.fill{border-color:var(--muted)}
.tile.pop{animation:pop .12s ease-out}
.tile[data-s]{color:#fff;border-color:transparent}
.tile[data-s=c]{background:var(--correct)}
.tile[data-s=p]{background:var(--present)}
.tile[data-s=a]{background:var(--absent)}
.tile.flip{animation:flip .5s ease both}
.tile.win{animation:bounce .6s ease both}
.row.shake{animation:shake .45s}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}70%{transform:translateY(2px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#kb{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;min-width:0;height:clamp(44px,6.5dvh,54px);border:0;border-radius:8px;background:var(--key);font-weight:700;font-size:14px;text-transform:uppercase;cursor:pointer;padding:0}
.key.wide{flex:1.55;font-size:12px}
.key:active{filter:brightness(.9)}
.key[data-s]{color:#fff}
.key[data-s=c]{background:var(--correct)}
.key[data-s=p]{background:var(--present)}
.key[data-s=a]{background:var(--absent)}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:30}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 24px;position:relative;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-family:var(--serif);font-weight:800;font-size:26px;margin:0 0 8px;letter-spacing:-.3px}
.sheet p{margin:8px 0;line-height:1.45;font-size:15px}
.x{position:absolute;right:10px;top:10px}
.big{font-family:var(--serif);font-weight:800;font-size:32px;letter-spacing:.06em;text-transform:uppercase}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin:12px 0}
.fact b{font-family:var(--serif)}
textarea{width:100%;height:118px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:15px/1.3 var(--sans);padding:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px;background:var(--accent);color:#fff}
.btn.alt{background:var(--key);color:var(--ink)}
.cd{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.cd b{font-variant-numeric:tabular-nums;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0 14px}
.stats b{display:block;font-family:var(--serif);font-size:28px;font-weight:800}
.stats span{font-size:11px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar i{background:var(--absent);color:#fff;font-style:normal;min-width:22px;padding:2px 6px;text-align:right;border-radius:4px;font-weight:700}
.bar i.hl{background:var(--correct)}
.ex{display:flex;gap:4px;margin:6px 0 2px}
.ex .tile{--t:36px;width:36px;height:36px;font-size:20px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer}
.pick .badge{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px}
.pick b{display:block;font-family:var(--serif);font-size:17px}
.pick span{font-size:12.5px;color:var(--muted)}
label.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:14px}
@media (prefers-reduced-motion: reduce){.tile.flip,.tile.win,.row.shake,.tile.pop,.sheet{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="bHelp" aria-label="How to play">?</button>
    <h1><span>Ugh</span>!</h1>

      <button class="ib" id="bPractice" aria-label="Practice a rule">🎲</button>
      <button class="ib" id="bStats" aria-label="Stats">📊</button>
    </div>
  </header>
  <section class="rule" id="rule" aria-live="polite"></section>
  <main><div id="board" aria-label="Guess board"></div></main>
  <div id="kb"></div>
</div>
<div id="toast" role="status"></div>
<div id="modal"></div>

const OB = new Set(OBSCURE_RAW.split(/\s+/).map(w => w.toLowerCase()));
const ALL = Array.from(new Set((WORDS_RAW + ' ' + OBSCURE_RAW).split(/\s+/)

function isPluralish(w) { return w.slice(-1) === 's' && w.slice(-2) !== 'ss'; }
RULES.forEach(r => {

  r.answers = ALL.filter(w => r.test(w) && !OB.has(w) && !isPluralish(w) && DEFS[w] && (!r.ok || r.ok(w)));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;

    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

function dayIndex(d) {
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) - LAUNCH_DAY;
}

// Days already played keep their original answers even though the word lists have grown since.
const PINNED = { 0: 'slate', 1: 'stiff' };
function dailyPuzzle(idx) {
  const n = RULES.length;
  const rule = RULES[((idx % n) + n) % n];
  const rng = mulberry32(idx * 7919 + 12345);
  const answer = PINNED[idx] || rule.answers[Math.floor(rng() * rule.answers.length)];
  return { rule, answer, number: idx + 1 };

// Challenge codes: one letter (which rule, A-Q) + 4 digits (which word). Same code = same word everywhere.

// 'c' = correct spot, 'p' = in word elsewhere, 'a' = absent
function score(guess, answer) {
  const res = Array(LEN).fill('a');
  const left = {};
  for (let i = 0; i < LEN; i++) {
    if (guess[i] === answer[i]) res[i] = 'c';
    else left[answer[i]] = (left[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < LEN; i++) {
    if (res[i] === 'c') continue;
    if (left[guess[i]] > 0) { res[i] = 'p'; left[guess[i]]--; }
  }
  return res;

function shareText(title, ruleName, icon, results, won) {
  const sq = { c: '🟦', p: '🟧', a: '⬛' };
  const tries = won ? results.length + '/' + ROWS : 'X/' + ROWS;
  return 'Ugh! ' + title + ' ' + icon + ' ' + ruleName + ' ' + tries + '\n\n' +
    results.map(r => r.map(c => sq[c]).join('')).join('\n');

<script>
(function () {

  /* ---------- storage ---------- */

      var t = tiles[r][c];
      t.classList.remove('fill', 'pop');
      if (reduce) { paintTile(r, c, res[c]); return; }
      t.style.animationDelay = (c * 0.22) + 's'; t.classList.add('flip');
      setTimeout(function () { paintTile(r, c, res[c]); }, c * 220 + 250);
    })(c);
    setTimeout(function () { G.busy = false; updateKeys(); afterGuess(w, r); }, reduce ? 0 : LEN * 220 + 450);
  }
  function afterGuess(w, r) {
    var won = w === G.answer;
    if (!won && G.guesses.length < ROWS) return;
    G.done = true; G.won = won;
    if (G.mode === 'daily') recordStats(won);
    if (won) {
      toast(PRAISE[r], 1600);
      for (var c = 0; c < LEN; c++) { var t = tiles[r][c]; t.style.animationDelay = (c * 0.1) + 's'; t.classList.remove('flip'); t.classList.add('win'); }
    } else toast(G.answer.toUpperCase(), 3000);
    setTimeout(function () { showResult(G); }, won ? 1500 : 1200);
  }
  function recordStats(won) {
    var s = store.stats; s.played++;
    if (won) {
      s.wins++; s.streak = (s.last === G.day - 1) ? s.streak + 1 : 1; s.last = G.day;
      s.best = Math.max(s.best, s.streak); s.dist[G.guesses.length - 1]++;
    } else s.streak = 0;
    save();
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || $('#modal').classList.contains('on')) return;
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Backspace') backspace();
    else if (/^[a-zA-Z]$/.test(e.key)) addLetter(e.key.toLowerCase());
  });
  $('#kb').addEventListener('click', function (e) {
    var k = e.target.closest('.key'); if (!k) return;
    if (k.dataset.k === 'Enter') submit(); else if (k.dataset.k === 'Back') backspace(); else addLetter(k.dataset.k);
  });

  /* ---------- modals ---------- */
  var cdTimer;
  function closeModal() { $('#modal').classList.remove('on'); clearInterval(cdTimer); }
  function openModal(html) {
    var m = $('#modal'); clearInterval(cdTimer);
    m.innerHTML = '<div class="sheet"><button class="ib x" id="mx" aria-label="Close">✕</button>' + html + '</div>';
    m.classList.add('on'); $('#mx').onclick = closeModal;
    return m;
  }
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

  function exampleRow(word, states) {
    return '<div class="ex">' + word.split('').map(function (ch, i) {
      return '<div class="tile"' + (states[i] ? ' data-s="' + states[i] + '"' : '') + '>' + ch + '</div>';
    }).join('') + '</div>';
  }
  function showHelp() {
    openModal('<h2>How to play</h2><p style="font-style:italic;color:var(--muted)">English spelling rules...ugh!</p><p><b>Ugh!</b> It’s what you say when English spelling gets you. Even <i>ough</i> can’t make up its mind: <i>tough, cough, though, bough, through, thought, thorough</i>. Seven sounds, one spelling.</p>' +
      '<p>Every puzzle has a <b>spelling rule</b>, and the secret 5-letter word follows it. Guess the word in 6 tries.</p>' +
      '<p><b>Here’s the twist:</b> your guesses must follow the rule too, so the rule is both your clue and your constraint.</p>' +
      exampleRow('brave', ['c', '', '', '', '']) + '<p style="margin-top:2px">B is in the word and in the right spot.</p>' +
      exampleRow('snake', ['', 'p', '', '', '']) + '<p style="margin-top:2px">N is in the word, but somewhere else.</p>' +
      exampleRow('globe', ['', '', 'a', '', '']) + '<p style="margin-top:2px">O isn’t in the word at all.</p>' +
      '<p>A new rule and word arrive every day at midnight.</p><p><b>Tap the 🎲 dice</b> to practice any rule. Every practice round has a <b>challenge code</b>: send it to a friend and you both get the same word. Got a code from a friend? Type it in the same place.</p>' +
      '<button class="btn" id="go">Let’s play</button>' +
      '<p style="text-align:center;font-size:12px;color:var(--muted);margin-top:16px">by Great Atlantic Learning Games<br>© 2026 Great Atlantic Learning Systems</p>');
    $('#go').onclick = closeModal;
    store.seen = true; save();
  }
  function cdText() {
    var n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
    var s = Math.max(0, Math.floor((t - n) / 1000)), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  function shareFor(g) {
    var res = g.guesses.map(function (w) { return score(w, g.answer); });
    return shareText(g.label, g.rule.name, g.rule.icon, res, g.guesses[g.guesses.length - 1] === g.answer);
  }
  function showResult(g) {
    var won = g.guesses[g.guesses.length - 1] === g.answer;
    var txt = shareFor(g);
    openModal('<h2>' + (won ? PRAISE[g.guesses.length - 1] : 'Next time!') + '</h2>' +
      '<div class="big">' + g.answer + '</div>' + (DEFS[g.answer] ? '<p style="margin-top:2px"><i>' + DEFS[g.answer] + '</i></p>' : '') +
      (soundNote(g.rule, g.answer) ? '<p style="margin-top:2px">' + soundNote(g.rule, g.answer) + '</p>' : '') +
      (g.mode === 'practice' ? '<p>Challenge code: <b>' + g.code + '</b>. Send it to a friend and they get the same word.</p>' : '') + '<div class="fact"><b>' + g.rule.icon + ' ' + g.rule.name + '.</b> ' + g.rule.fact + '</div>' +
      '<textarea id="sh" readonly aria-label="Your result">' + txt + '</textarea>' +
      '<button class="btn" id="cp">Copy result to share</button>' +
      '<button class="btn alt" id="pr">Practice another rule</button>' +
      (g.mode === 'daily' ? '<div class="cd">Next rule in <b id="cd">' + cdText() + '</b></div>' : ''));
    $('#sh').onfocus = function () { this.select(); };
    $('#cp').onclick = function () { copyText(txt, this); };
    $('#pr').onclick = showPractice;
    if (g.mode === 'daily') cdTimer = setInterval(function () { var e = $('#cd'); if (e) e.textContent = cdText(); }, 1000);
  }
  function copyText(txt, btn) {
    function ok() { btn.textContent = 'Copied! Paste it anywhere'; }
    function fallback() {
      var ta = $('#sh');
      try { ta.focus(); ta.select(); if (document.execCommand('copy')) { ok(); return; } } catch (e) {}
      btn.textContent = 'Select the text above and copy it';
    }
    try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
  }
  function showStats() {
    var s = store.stats, mx = Math.max.apply(null, s.dist.concat([1]));
    var pct = s.played ? Math.round(100 * s.wins / s.played) : 0;
    var hl = (G.mode === 'daily' && G.done && G.won) ? G.guesses.length - 1 : -1;
    var bars = s.dist.map(function (n, i) {
      return '<div class="bar"><span style="width:10px">' + (i + 1) + '</span><i class="' + (i === hl ? 'hl' : '') + '" style="width:' + Math.max(8, 100 * n / mx * 0.8) + '%">' + n + '</i></div>';
    }).join('');
    var dailyDone = store.daily && store.daily.day === dayIndex(new Date()) &&
      (store.daily.guesses.length >= ROWS || store.daily.guesses[store.daily.guesses.length - 1] === dailyPuzzle(store.daily.day).answer);
    openModal('<h2>Your stats</h2><div class="stats"><div><b>' + s.played + '</b><span>Played</span></div><div><b>' + pct +
      '</b><span>Win %</span></div><div><b>' + s.streak + '</b><span>Streak</span></div><div><b>' + s.best + '</b><span>Best</span></div></div>' +
      '<b>Guess distribution</b>' + bars +
      (dailyDone ? '<button class="btn" id="td">Today’s result &amp; share</button>' : '') +
      '<button class="btn alt" id="pr">Practice a rule</button>');
    $('#pr').onclick = showPractice;
    var td = $('#td');
    if (td) td.onclick = function () {
      var p = dailyPuzzle(store.daily.day);
      showResult({ mode: 'daily', rule: p.rule, answer: p.answer, label: '#' + p.number, guesses: store.daily.guesses });
    };
  }
  function showPractice() {
    var html = '<h2>Practice</h2><p>Practice never touches your daily streak.</p>' +
      '<p><b>Challenge a friend:</b> enter their code to get the same word.</p>' +
      '<div style="display:flex;gap:8px;margin-bottom:6px"><input id="cc" maxlength="5" placeholder="e.g. K4821" autocapitalize="characters" autocomplete="off" style="flex:1;min-width:0;font:700 18px var(--sans);text-transform:uppercase;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)"><button class="btn" id="ccgo" style="width:auto;margin:0;padding:0 20px">Play</button></div>' +
      '<p style="margin-top:14px">Or pick a rule to drill:</p>' +
      '<button class="pick" data-i="-1"><div class="badge">🎲</div><div><b>Surprise me</b><span>A random rule and word</span></div></button>';
    RULES.forEach(function (r, i) {
      html += '<button class="pick" data-i="' + i + '"><div class="badge">' + r.icon + '</div><div><b>' + r.name + '</b><span>' + r.desc + ' · ' + r.valid.size + ' words</span></div></button>';
    });
    openModal(html);
    $('#ccgo').onclick = function () {
      var p = puzzleFromCode($('#cc').value);
      if (!p) { toast('That code doesn’t look right. It is a letter and 4 numbers.', 2400); return; }
      closeModal(); setPractice(p);
    };
    document.querySelectorAll('.pick').forEach(function (b) {
      b.onclick = function () { var i = +b.dataset.i; closeModal(); startPractice(i < 0 ? null : RULES[i]); };
    });
  }
  $('#bHelp').onclick = showHelp;
  $('#bStats').onclick = showStats;
  $('#bPractice').onclick = showPractice;

  /* ---------- go ---------- */
  buildBoard(); buildKeys(); startDaily();
  if (!store.seen) showHelp();
  else if (G.done) setTimeout(function () { showResult(G); }, 350);
})();
</script>
</body>
</html>
